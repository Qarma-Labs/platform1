openapi: 3.1.1
info:
  title: Elearn.Api | v1
  version: 1.0.0
servers:
  - url: http://localhost:5001/
paths:
  /health:
    get:
      tags:
        - Elearn.Api
      responses:
        '200':
          description: OK
  /api/v1/auth/register:
    post:
      tags:
        - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/login:
    post:
      tags:
        - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshSession
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      responses:
        '204':
          description: No Content
  /api/v1/auth/me:
    get:
      tags:
        - auth
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/forgot-password:
    post:
      tags:
        - auth
      operationId: forgotPassword
      responses:
        '202':
          description: Accepted
  /api/v1/courses:
    get:
      tags:
        - catalog
      operationId: listCourses
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: integer
            format: int64
        - name: maxPrice
          in: query
          schema:
            type: integer
            format: int64
        - name: minRating
          in: query
          schema:
            pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?$
            type:
              - number
              - string
            format: double
        - name: sort
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
  /api/v1/courses/{slug}:
    get:
      tags:
        - catalog
      operationId: getCourse
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/categories:
    get:
      tags:
        - catalog
      operationId: listCategories
      responses:
        '200':
          description: OK
  /api/v1/instructor/courses:
    post:
      tags:
        - catalog
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
        required: true
      responses:
        '200':
          description: OK
  /api/v1/checkout:
    post:
      tags:
        - payments
      operationId: checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/orders/{id}:
    get:
      tags:
        - payments
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResult'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/coupons/validate:
    post:
      tags:
        - payments
      operationId: validateCoupon
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: subtotal
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCouponResult'
        '422':
          description: Unprocessable Entity
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/webhooks/payments/{provider}:
    post:
      tags:
        - payments
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentEvent'
        required: true
      responses:
        '200':
          description: OK
  /api/v1/sessions/{id}/reserve:
    post:
      tags:
        - workshops
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
    delete:
      tags:
        - workshops
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/me/enrollments:
    get:
      tags:
        - learning
      operationId: listMyEnrollments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'
  /api/v1/lessons/{id}/complete:
    post:
      tags:
        - learning
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/v1/verify/{code}:
    get:
      tags:
        - learning
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v1/courses/{id}/reviews:
    post:
      tags:
        - learning
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Review'
        required: true
      responses:
        '200':
          description: OK
  /api/v1/admin/courses:
    get:
      tags:
        - learning
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
  /api/v1/dev/payments/simulate/{orderId}:
    post:
      tags:
        - dev
      operationId: simulatePayment
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
components:
  schemas:
    AuthUserDto:
      required:
        - id
        - email
        - fullName
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
            - 'null'
            - string
        fullName:
          type: string
    CheckoutItem:
      required:
        - type
        - id
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          default: 1
    CheckoutRequest:
      required:
        - items
        - couponCode
        - paymentMethod
        - phone
        - orgId
        - returnUrl
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckoutItem'
        couponCode:
          type:
            - 'null'
            - string
        paymentMethod:
          type: string
        phone:
          type:
            - 'null'
            - string
        orgId:
          type:
            - 'null'
            - string
          format: uuid
        returnUrl:
          type:
            - 'null'
            - string
    CheckoutResult:
      required:
        - orderId
        - number
        - status
        - total
        - currency
        - paymentInstruction
        - pollAfterMs
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        number:
          type: string
        status:
          type: string
        total:
          type: integer
          format: int64
        currency:
          type: string
        paymentInstruction:
          type: string
        pollAfterMs:
          type: integer
          format: int32
    CourseDetail:
      required:
        - id
        - slug
        - type
        - title
        - subtitle
        - description
        - language
        - level
        - price
        - currency
        - ratingAvg
        - ratingCount
        - enrollmentCount
        - thumbnailKey
        - status
        - publishedAt
        - instructorName
        - tags
        - curriculum
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        type:
          type: string
        title:
          type: string
        subtitle:
          type:
            - 'null'
            - string
        description:
          type:
            - 'null'
            - string
        language:
          type: string
        level:
          type: string
        price:
          type: integer
          format: int64
        currency:
          type: string
        ratingAvg:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          format: double
        ratingCount:
          type: integer
          format: int32
        enrollmentCount:
          type: integer
          format: int32
        thumbnailKey:
          type:
            - 'null'
            - string
        status:
          type: string
        publishedAt:
          type:
            - 'null'
            - string
          format: date-time
        instructorName:
          type: string
        tags:
          type: array
          items:
            type: string
        curriculum:
          type: array
          items:
            $ref: '#/components/schemas/SectionOutline'
    CourseListResponse:
      required:
        - items
        - hasMore
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        hasMore:
          type: boolean
    CourseSummary:
      required:
        - id
        - slug
        - title
        - subtitle
        - type
        - language
        - level
        - price
        - currency
        - ratingAvg
        - ratingCount
        - enrollmentCount
        - thumbnailKey
        - status
        - instructorName
        - tags
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        subtitle:
          type:
            - 'null'
            - string
        type:
          type: string
        language:
          type: string
        level:
          type: string
        price:
          type: integer
          format: int64
        currency:
          type: string
        ratingAvg:
          pattern: ^-?(?:0|[1-9]\d*)(?:\.\d+)?$
          type:
            - number
            - string
          format: double
        ratingCount:
          type: integer
          format: int32
        enrollmentCount:
          type: integer
          format: int32
        thumbnailKey:
          type:
            - 'null'
            - string
        status:
          type: string
        instructorName:
          type: string
        tags:
          type: array
          items:
            type: string
    CreateCourseRequest:
      required:
        - title
        - type
        - language
        - level
        - price
        - currency
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        language:
          type: string
        level:
          type: string
        price:
          type: integer
          format: int64
        currency:
          type: string
    Enrollment:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        orderId:
          type:
            - 'null'
            - string
          format: uuid
        source:
          type: string
        status:
          type: string
        expiresAt:
          type:
            - 'null'
            - string
          format: date-time
        completedAt:
          type:
            - 'null'
            - string
          format: date-time
        certificateId:
          type:
            - 'null'
            - string
          format: uuid
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LessonOutline:
      required:
        - id
        - title
        - type
        - durationSec
        - isPreview
        - position
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        type:
          type: string
        durationSec:
          type: integer
          format: int32
        isPreview:
          type: boolean
        position:
          type: integer
          format: int32
    LoginRequest:
      required:
        - identifier
        - password
      type: object
      properties:
        identifier:
          type: string
        password:
          type: string
    MeResponse:
      required:
        - user
      type: object
      properties:
        user:
          $ref: '#/components/schemas/MeUserDto'
    MeUserDto:
      required:
        - id
        - email
        - phone
        - fullName
        - avatarKey
        - language
        - status
        - emailVerifiedAt
        - phoneVerifiedAt
        - lastLoginAt
        - roles
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type:
            - 'null'
            - string
        phone:
          type:
            - 'null'
            - string
        fullName:
          type: string
        avatarKey:
          type:
            - 'null'
            - string
        language:
          type: string
        status:
          type: string
        emailVerifiedAt:
          type:
            - 'null'
            - string
          format: date-time
        phoneVerifiedAt:
          type:
            - 'null'
            - string
          format: date-time
        lastLoginAt:
          type:
            - 'null'
            - string
          format: date-time
        roles:
          type: array
          items:
            type: string
    PaymentEvent:
      type: object
      properties:
        provider:
          type: string
        eventId:
          type: string
        signatureValid:
          type: boolean
        payloadJson:
          type: string
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type:
            - 'null'
            - string
          format: date-time
        processingError:
          type:
            - 'null'
            - string
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
            - 'null'
            - integer
            - string
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
    RegisterRequest:
      required:
        - email
        - phone
        - password
        - fullName
      type: object
      properties:
        email:
          type:
            - 'null'
            - string
        phone:
          type:
            - 'null'
            - string
        password:
          type: string
        fullName:
          type: string
        language:
          type: string
          default: sw
    RegistrationResponse:
      required:
        - user
        - tokens
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUserDto'
        tokens:
          $ref: '#/components/schemas/TokenPair'
    Review:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        rating:
          type: integer
          format: int16
        body:
          type:
            - 'null'
            - string
        status:
          type: string
        instructorReply:
          type:
            - 'null'
            - string
        repliedAt:
          type:
            - 'null'
            - string
          format: date-time
        deletedAt:
          type:
            - 'null'
            - string
          format: date-time
        isDeleted:
          type: boolean
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SectionOutline:
      required:
        - id
        - title
        - position
        - lessons
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
          format: int32
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonOutline'
    TokenPair:
      required:
        - accessToken
        - accessExpiresAt
      type: object
      properties:
        accessToken:
          type: string
        accessExpiresAt:
          type: string
          format: date-time
    TokenResponse:
      required:
        - tokens
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
    ValidateCouponResult:
      required:
        - discount
      type: object
      properties:
        discount:
          type: integer
          format: int64
tags:
  - name: Elearn.Api
  - name: auth
  - name: catalog
  - name: payments
  - name: workshops
  - name: learning
  - name: dev
